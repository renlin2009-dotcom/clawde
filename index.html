<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e7e9ee; --muted: #8b92a1;
    --accent: #6ea8fe; --user: #2a3b5c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1a1d23; --muted: #6b7280; --accent: #2563eb; --user: #dbe7ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header h1 span { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .ghost:hover { color: var(--text); border-color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: 85%; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot .bubble > :first-child { margin-top: 0; } .bot .bubble > :last-child { margin-bottom: 0; }
  .bubble pre { background: var(--bg); border: 1px solid var(--line); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .bubble code { font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .err { color: #f87171; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h2 { color: var(--text); font-weight: 600; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chips button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .chips button:hover { border-color: var(--accent); }
  form { padding: 12px 16px 18px; border-top: 1px solid var(--line); }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .bar:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: inherit; max-height: 180px; padding: 6px 8px; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 500; }
  #send:disabled { opacity: .45; cursor: default; }
  .note { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  .load { max-width: 420px; margin: 10vh auto 0; text-align: center; color: var(--muted); }
  .load h2 { color: var(--text); font-weight: 600; margin-bottom: 6px; }
  .load button { margin-top: 16px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 500; }
  .prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 16px; display: none; }
  .prog div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .ptext { font-size: 12px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>🦀 <span>Clawde</span></h1>
  <button class="ghost" id="clear" type="button">New chat</button>
</header>
<div id="log"><div class="wrap" id="msgs"></div></div>
<form id="form">
  <div class="bar">
    <textarea id="input" rows="1" placeholder="Message Clawde…"></textarea>
    <button id="send" type="submit" disabled>Send</button>
  </div>
  <div class="note" id="note">Enter to send · Shift+Enter for a new line</div>
</form>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.87";

const MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
const SYSTEM = "You are Clawde, a friendly, helpful AI assistant shaped like a crab. Answer clearly and concisely. Use Markdown when it helps. Make a light crab pun now and then, but keep answers useful.";
const STARTERS = ["Explain how neural networks learn", "Write a Python function to reverse a string", "Quiz me on calculus limits", "Give me a fun fact"];

const msgs = document.getElementById('msgs');
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const note = document.getElementById('note');
let history = [];
let engine = null;
let busy = false;
let stopFlag = false;

const md = t => DOMPurify.sanitize(marked.parse(t || ''));
const scroll = () => { log.scrollTop = log.scrollHeight; };

function renderLoader() {
  input.disabled = true;
  if (!navigator.gpu) {
    msgs.innerHTML = `<div class="load"><h2>🦀 Clawde can't run here</h2>
      <div>Clawde runs entirely in your browser and needs WebGPU. Try a recent version of Chrome or Edge on a laptop or desktop.</div></div>`;
    return;
  }
  msgs.innerHTML = `<div class="load"><h2>🦀 Wake up Clawde</h2>
    <div>Clawde runs entirely on your device: free, private, no sign-in. The first time, it downloads about 1 GB. After that it loads from cache.</div>
    <button id="wake" type="button">Load Clawde</button>
    <div class="prog"><div></div></div><div class="ptext"></div></div>`;
  document.getElementById('wake').onclick = load;
}

async function load() {
  const btn = document.getElementById('wake');
  const bar = msgs.querySelector('.prog'), fill = bar.firstElementChild, ptext = msgs.querySelector('.ptext');
  btn.style.display = 'none'; bar.style.display = 'block';
  try {
    engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: p => { fill.style.width = Math.round((p.progress || 0) * 100) + '%'; ptext.textContent = p.text || ''; }
    });
    input.disabled = false; input.focus();
    renderEmpty();
  } catch (e) {
    ptext.textContent = 'Failed to load: ' + (e.message || e) + '. Close other tabs and try again.';
    btn.style.display = ''; btn.textContent = 'Try again';
  }
}

function renderEmpty() {
  msgs.innerHTML = `<div class="empty"><h2>What's on your mind?</h2><div>Ask anything to get started.</div><div class="chips"></div></div>`;
  const chips = msgs.querySelector('.chips');
  STARTERS.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => ask(s); chips.appendChild(b); });
}

function addMsg(role, text) {
  if (msgs.querySelector('.empty')) msgs.innerHTML = '';
  const row = document.createElement('div'); row.className = 'msg ' + role;
  const b = document.createElement('div'); b.className = 'bubble';
  if (role === 'user') b.textContent = text; else b.innerHTML = md(text);
  row.appendChild(b); msgs.appendChild(row); scroll();
  return b;
}

function setBusy(v) {
  busy = v;
  send.textContent = v ? 'Stop' : 'Send';
  send.type = v ? 'button' : 'submit';
  send.disabled = !v && !input.value.trim();
}

async function ask(text) {
  text = text.trim();
  if (!text || busy || !engine) return;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  input.value = ''; autosize();
  const bubble = addMsg('bot', '_Thinking…_');
  setBusy(true); stopFlag = false;
  let reply = '';
  try {
    const chunks = await engine.chat.completions.create({
      messages: [{ role: 'system', content: SYSTEM }, ...history.slice(-12)],
      stream: true, temperature: 0.7
    });
    for await (const c of chunks) {
      if (stopFlag) { engine.interruptGenerate(); break; }
      reply += c.choices[0]?.delta?.content || '';
      bubble.innerHTML = md(reply); scroll();
    }
    if (!reply) { bubble.innerHTML = '<em>Stopped.</em>'; history.pop(); }
    else history.push({ role: 'assistant', content: reply });
  } catch (e) {
    history.pop();
    bubble.innerHTML = `<span class="err">${DOMPurify.sanitize(e.message || 'Something went wrong.')}</span>`;
  } finally { setBusy(false); scroll(); input.focus(); }
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; send.disabled = !busy && !input.value.trim(); }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
send.addEventListener('click', e => { if (busy) { e.preventDefault(); stopFlag = true; } });
document.getElementById('clear').onclick = async () => {
  if (!engine) return;
  stopFlag = true; history = [];
  try { await engine.resetChat(); } catch {}
  renderEmpty(); input.focus();
};

note.textContent = 'Runs on your device · Enter to send · Shift+Enter for a new line';
renderLoader();
</script>
</body>
</html>
